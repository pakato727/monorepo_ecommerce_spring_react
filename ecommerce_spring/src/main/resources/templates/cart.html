<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="titoloPagina='Tabella Utenti'"
      layout:decorate="~{layout}">


<div id="cart" layout:fragment="cart">
    <div th:if="${autenticato}" class="container py-5 row bg-light rounded mt-5">

        <h1 class="mb-5">Carrello</h1>
        <div class="row">
            <div class="col-lg-8">
                <!-- Cart Items -->
                <div class="card mb-4">
                    <div th:each="entry : ${prodottiConQuantita}" class="card-body">
                        <div class="row cart-item mb-3">
                            <div class="col-md-3">
                                <img th:if="${entry.key.base64Image != null}"
                                     th:src="@{'data:image/jpeg;base64,' + ${entry.key.base64Image}}"
                                     alt="Immagine Prodotto" width="100" height="100"/>
                            </div>
                            <div class="col-md-5">
                                <h5 class="card-title" th:text="${entry.key.nomeProdotto}"></h5>
                                <p class="text-muted" th:text="${entry.key.categoria}"></p>
                            </div>
                            <div class="col-md-2">
                                <div class="input-group">
                                    <button class="btn btn-outline-secondary btn-sm removeBtn" type="button"
                                            onclick="removeOne()">-
                                    </button>
                                    <input style="max-width:100px" type="text"
                                           class="form-control  form-control-sm text-center quantity-input"
                                           th:value="${entry.value}" th:attr="data-quantitaV=${entry.value}">
                                    <button class="btn btn-outline-secondary btn-sm addBtn" type="button" >+
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-2 text-end">
                                <p class="fw-bold price" th:text="${entry.key.prezzo}"></p>
                                <a th:href="@{/server/deleteProdCart/{id}(id=${entry.key.id})}" class="btn btn-sm btn-outline-danger">
                                    <i  class="fa-solid fa-trash"></i>
                                </a>
                            </div>
                        </div>
                        <hr>

                    </div>
                </div>
                <!-- Continue Shopping Button -->
                <div class="text-start mb-4">
                    <a th:href="@{/server/readAllProducts}" class="btn btn-outline-dark">
                        <i class="fa-solid fa-arrow-left me-2"></i>Continua a comprare
                    </a>
                </div>
            </div>
            <div class="col-lg-4">
                <!-- Cart Summary -->
                <div class="card cart-summary">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Order Summary</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal</span>
                            <span></span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Shipping</span>
                            <span></span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Tax</span>
                            <span></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <strong>Total</strong>
                            <strong id="totale">0.00</strong>
                        </div>
                        <button class="btn btn-dark w-100" onclick="order()">Procedi al Checkout</button>
                    </div>
                </div>
                <!-- Promo Code -->
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Applica Codice Sconto</h5>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Enter promo code">
                            <button class="btn btn-outline-secondary" type="button">Applica</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            /*
            let totale=document.getElementById("totale");
            let prezzoclass=document.getElementsByClassName("prezzo").value;
           //let prezzo=document.getElementById('prezzo').value;
            let quantita=document.querySelectorAll('quantita').value;
            let totalissimo=0;

            prezzoclass.forEach(element => {
                totalissimo+element;
            });
            totale.textContent=totalissimo;
            */


            let totale=document.getElementById("totale");

            let queryPrice=document.querySelectorAll(".price");
        console.log("ecco il tipo: ");
        console.log(typeof queryPrice);
        let prezzot=0;

        queryPrice.forEach(element => {
        let value=element.getAttribute('data-prezzoV');

        prezzot+=parseFloat(value);


       });
       totale.textContent=prezzot.toFixed(2);





                //let queryQuantita=document.querySelectorAll('.quantity-input');
                let addBtn=document.querySelectorAll('.addBtn');
                addBtn.forEach(element => {
                element.addEventListener("click", function(){
                const input = this.parentElement.querySelector('.quantity-input');
                        let value=input.getAttribute('data-quantitaV');
        var quantitaCorrente = parseInt(value, 10);
        var nuovaQuantita = quantitaCorrente + 1;
        input.setAttribute('data-quantitaV', nuovaQuantita);
        input.value = nuovaQuantita;

       });
       });





            function removeOne() {
                var quantita = document.getElementById('quantita');
                var quantitaCorrente = parseInt(quantita.value, 10);
                if (quantita.value > 0) {
                    quantita.value = quantitaCorrente - 1;
                } else {
                    quantita.value = 1;
                }
            }

            function order() {
                alert('Il prodotto è stato ordinato');
            }
        </script>

    </div>


    <div class="container py-5 row rounded mt-5" style="background-color: #212529;" th:if="${!autenticato}">
        <div class="container">
            <h2 style="color: #fed136; " class="primary">Accedi per visualizzare il carrello e continuare con i tuoi
                acquisti.</h2>
        </div>
        <script>
            let accedi = document.getElementById("login");
            setTimeout(function () {
                accedi.click();
            }, 1500);

        </script>

    </div>


</div>

</html>
