

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}" th:with="titoloPagina='Account Confermato'">
<head>
    
</head>
<div class="conferma-content" layout:fragment="conferma">


    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="text-primary">Grazie per averci scelto!</h2>
                    <p class="lead">Il tuo account è pronto alla verifica, tra poco potrai navigare liberamente nel nostro sito.</p>
                    <div class="d-flex justify-content-center align-items-center vh-100">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Caricamento...</span>
                        </div>
                    </div>
                    <a id="redirectLink" th:attr="data-url=@{/server/accountVerify(token=${token})}" style="display: none;"></a>


                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript" type="text/javascript">

    setTimeout(function() {
        alert("sono qui");

            window.location.href = document.getElementById("redirectLink").getAttribute("data-url");
        }, 5000);

       
    </script>

</div>
</html>
